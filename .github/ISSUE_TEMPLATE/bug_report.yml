name: Bug report
description: Something on the site looks broken or does not work.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page with the problem.
      placeholder: https://ayukhno.github.io/story/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 26 / Windows 11, Chrome 141
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here.
