name: Content correction
description: A typo, an outdated fact or a broken link.
labels: [content]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://ayukhno.github.io/en.html
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text or link
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested correction
    validations:
      required: true
